<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Shop</h1>
      <label>
        Category
        <select id="category">
          <option value="all" selected>All</option>
          <option value="books">Books</option>
          <option value="games">Games</option>
          <option value="music">Music</option>
        </select>
      </label>
    </header>
    <main>
      <section id="products" aria-label="Products"></section>
      <aside id="cart" aria-label="Cart">
        <h2>Cart</h2>
        <ul id="cart-lines"></ul>
        <p id="message" role="status"></p>
        <dl id="cart-totals">
          <dt>Subtotal</dt>
          <dd id="subtotal">$0.00</dd>
          <dt>Shipping</dt>
          <dd id="shipping">$0.00</dd>
          <dt>Total</dt>
          <dd id="total">$0.00</dd>
        </dl>
      </aside>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
